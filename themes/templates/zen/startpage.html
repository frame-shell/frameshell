<!doctype html>
<!-- frameshell start page for Zen ({{name}}). Generated by `frame theme`; edit
     themes/templates/zen/startpage.html instead. Zen opens it as its home page.
     The search takes the launcher's shortcuts: "yt lofi", "aw hyprland", "gh quickshell". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frameshell</title>
<style>
  :root {
    --bg: {{colors.bg}};
    --surface: {{colors.surface}};
    --border: {{colors.surface2}};
    --primary: {{colors.primary}};
    --secondary: {{colors.secondary}};
    --text: {{colors.text}};
    --dim: {{colors.textDim}};
    --muted: {{colors.muted}};
    --frame: {{colors.frame}};
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "JetBrains Mono", monospace;
    display: grid;
    place-items: center;
  }
  main {
    width: min(720px, calc(100vw - 32px));
    border: 1px solid var(--border);
    padding: 40px 36px 28px;
    position: relative;
  }
  /* The label in the top border, like the shell's frames */
  main::before {
    content: " frameshell ";
    position: absolute;
    top: -0.8em;
    left: 24px;
    padding: 0 4px;
    background: var(--bg);
    color: var(--primary);
    font-weight: 600;
  }
  .clock { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -2px; }
  .date { color: var(--muted); margin: 8px 0 28px; }
  form { display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); padding: 12px 16px; }
  form:focus-within { border-color: var(--primary); }
  form span { color: var(--primary); font-size: 20px; }
  input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 18px;
  }
  input::placeholder { color: var(--frame); }
  .engine { color: var(--secondary); font-size: 13px; min-width: 6ch; text-align: right; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 22px; }
  nav a { color: var(--dim); text-decoration: none; }
  nav a:hover, nav a:focus { color: var(--secondary); outline: 0; }
  nav a b { color: var(--muted); font-weight: 400; }
  footer { margin-top: 24px; color: var(--frame); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form id="search" autocomplete="off">
    <span>❯</span>
    <input id="q" autofocus placeholder="search · g ddg yt gh aw aur w r">
    <span class="engine" id="engine">ddg</span>
  </form>
  <nav>
    <a href="https://github.com"><b>gh</b> github</a>
    <a href="https://www.youtube.com"><b>yt</b> youtube</a>
    <a href="https://wiki.archlinux.org"><b>aw</b> arch wiki</a>
    <a href="https://aur.archlinux.org"><b>aur</b> aur</a>
    <a href="https://www.reddit.com"><b>r</b> reddit</a>
    <a href="https://claude.ai"><b>c</b> claude</a>
  </nav>
  <footer>enter searches · a shortcut first picks the engine · an address opens directly</footer>
</main>
<script>
  // The same engines and shortcuts as the launcher's "?" (quickshell config/Config.qml)
  const engines = {
    g: "https://www.google.com/search?q=%s",
    ddg: "https://duckduckgo.com/?q=%s",
    yt: "https://www.youtube.com/results?search_query=%s",
    gh: "https://github.com/search?q=%s",
    aw: "https://wiki.archlinux.org/index.php?search=%s",
    aur: "https://aur.archlinux.org/packages?K=%s",
    w: "https://en.wikipedia.org/w/index.php?search=%s",
    r: "https://www.reddit.com/search/?q=%s"
  };
  const fallback = "ddg";
  const q = document.getElementById("q");
  const label = document.getElementById("engine");

  function parse(text) {
    const words = text.trim().split(/\s+/);
    if (words.length > 1 && engines[words[0]]) return { key: words[0], rest: words.slice(1).join(" ") };
    return { key: fallback, rest: text.trim() };
  }

  q.addEventListener("input", () => { label.textContent = parse(q.value).key; });

  document.getElementById("search").addEventListener("submit", event => {
    event.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    // "archlinux.org" or "localhost:8080/x" opens as it is
    if (!/\s/.test(text) && /^([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$|^localhost(:\d+)?(\/.*)?$/i.test(text)) {
      location.href = /^https?:\/\//i.test(text) ? text : `https://${text}`;
      return;
    }
    const { key, rest } = parse(text);
    location.href = engines[key].replace("%s", encodeURIComponent(rest));
  });

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    document.getElementById("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }).toLowerCase();
  }
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
